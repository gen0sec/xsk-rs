name: CI

on:
  push:
    branches: [ master, 'release/**' ]
  pull_request:
    branches: [ master, 'release/**' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt update
          sudo apt install clang llvm gcc-multilib libelf-dev libpcap-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  test:
    name: Test (libxdp-sys ${{ matrix.libxdp-sys }})
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        # The floor is the release gen0sec consumers lock alongside
        # libbpf-sys 1.7, so it is tested as well as the newest.
        libxdp-sys: [newest, 0.2.2+1.5.5]
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt update
          sudo apt install clang llvm gcc-multilib libelf-dev libpcap-dev build-essential m4
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.libxdp-sys != 'newest'
        run: cargo update -p libxdp-sys --precise "${{ matrix.libxdp-sys }}"
      - run: ./run_all_tests.sh
      - run: cargo test --doc

  miri:
    name: Miri
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt update
          sudo apt install clang llvm gcc-multilib libelf-dev libpcap-dev build-essential
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test --lib

  fmt:
    name: Rustfmt
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt update
          sudo apt install clang llvm gcc-multilib libelf-dev libpcap-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings
